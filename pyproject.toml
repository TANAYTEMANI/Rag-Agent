[tool.poetry]
name = "rag-agent"
version = "0.1.0"
description = "Production-grade multimodal RAG agent"
authors = []
readme = "README.md"
packages = [{ include = "." }]

[tool.poetry.dependencies]
python              = "^3.11"
# API framework
fastapi             = "^0.115"
uvicorn             = { extras = ["standard"], version = "^0.30" }
python-multipart    = "^0.0.9"
sse-starlette       = "^2.1"
# Config
pydantic-settings   = "^2.3"
pydantic            = "^2.7"
# Document parsing
docling             = "^2.33"
# LLM
anthropic           = "^0.34"
# HTTP client (Jina + Anthropic streaming)
httpx               = "^0.27"
tenacity            = "^8.3"
# Vector DB
qdrant-client       = { extras = ["async"], version = "^1.9" }
# PostgreSQL
sqlalchemy          = { extras = ["asyncio"], version = "^2.0" }
asyncpg             = "^0.29"
alembic             = "^1.13"
# Redis / Celery
celery              = { extras = ["redis"], version = "^5.4" }
redis               = "^5.0"
# Tabular
pandas              = "^2.2"
openpyxl            = "^3.1"
pyarrow             = "^16.0"
asteval             = "^0.9"
# Evaluation
ragas               = "^0.1"
# Utils
python-dotenv       = "^1.0"
structlog           = "^24.1"
pillow              = "^10.0"

[tool.poetry.group.dev.dependencies]
pytest          = "^8.2"
pytest-asyncio  = "^0.23"
httpx           = "^0.27"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
