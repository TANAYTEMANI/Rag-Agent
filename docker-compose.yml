services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragdb
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
    command: redis-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports: ["8000:8000"]
    env_file: .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://rag:rag@postgres:5432/ragdb
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
    volumes:
      - ./uploads:/app/uploads
      - ./table_store:/app/table_store
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_started }
      qdrant:   { condition: service_started }
    restart: unless-stopped

  # parse and embed use the same image — no more separate heavy worker build
  worker-parse:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: celery -A ingestion.worker worker -Q parse --concurrency=16 --loglevel=info
    env_file: .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://rag:rag@postgres:5432/ragdb
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      PYTHONPATH: /app
    volumes:
      - ./uploads:/app/uploads
      - ./table_store:/app/table_store
    depends_on:
      redis:    { condition: service_started }
      postgres: { condition: service_healthy }
      qdrant:   { condition: service_started }
    restart: unless-stopped

  worker-embed:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: celery -A ingestion.worker worker -Q embed --concurrency=16 --loglevel=info
    env_file: .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://rag:rag@postgres:5432/ragdb
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      PYTHONPATH: /app
    volumes:
      - ./uploads:/app/uploads
      - ./table_store:/app/table_store
    depends_on:
      redis:    { condition: service_started }
      postgres: { condition: service_healthy }
      qdrant:   { condition: service_started }
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
